name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build LUNÉ for iOS
    runs-on: xcode-27
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Show Xcode version
        run: xcodebuild -version
      
      - name: Show available SDKs
        run: xcodebuild -showsdks
      
      - name: Build for device
        run: |
          xcodebuild clean build \
            -project LUNE.xcodeproj \
            -scheme LUNE \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            BUILD_DIR="${PWD}/build"
      
      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/LUNE.app Payload/
          zip -r LUNE-unsigned.ipa Payload
          rm -rf Payload
      
      - name: Verify IPA structure
        run: |
          unzip -l LUNE-unsigned.ipa
          echo "---"
          echo "IPA created successfully"
      
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LUNE-unsigned
          path: LUNE-unsigned.ipa
          retention-days: 30
