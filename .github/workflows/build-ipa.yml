name: Build LUNÉ unsigned IPA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build unsigned device IPA
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and build number
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          BUILD_NUMBER=${{ github.run_number }}
          if [ -z "$VERSION" ]; then echo "VERSION file is empty"; exit 1; fi
          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "IPA_NAME=LUNE-v${VERSION}-build${BUILD_NUMBER}-unsigned.ipa" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=LUNE-v${VERSION}-build${BUILD_NUMBER}-unsigned" >> "$GITHUB_ENV"
          echo "Building LUNÉ v${VERSION} (${BUILD_NUMBER})"

      - name: Inspect toolchain
        run: |
          echo "--- xcode-select ---"
          xcode-select -p
          echo "--- xcodebuild ---"
          xcodebuild -version
          echo "--- SDKs ---"
          xcodebuild -showsdks
          echo "--- schemes ---"
          xcodebuild -list -project LUNE.xcodeproj

      - name: Build for iOS device (Release, unsigned)
        run: |
          xcodebuild clean build \
            -project LUNE.xcodeproj \
            -scheme LUNE \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            INFOPLIST_EXPAND_BUILD_SETTINGS=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            BUILD_DIR="${PWD}/build" \
            ONLY_ACTIVE_ARCH=NO \
            -quiet

      - name: Verify built app
        run: |
          test -d build/Release-iphoneos/LUNE.app || { echo "LUNE.app not found"; exit 1; }
          echo "--- executable ---"
          file build/Release-iphoneos/LUNE.app/LUNE
          echo "--- architectures ---"
          lipo -info build/Release-iphoneos/LUNE.app/LUNE
          if file build/Release-iphoneos/LUNE.app/LUNE | grep -qi 'simulator'; then
            echo "ERROR: simulator executable instead of device executable"
            exit 1
          fi
          if ! lipo -info build/Release-iphoneos/LUNE.app/LUNE | grep -q 'arm64'; then
            echo "ERROR: no arm64 device slice"
            exit 1
          fi

      - name: Create IPA
        run: |
          rm -rf Payload "${IPA_NAME}"
          mkdir -p Payload
          cp -R build/Release-iphoneos/LUNE.app Payload/
          zip -qry "${IPA_NAME}" Payload
          rm -rf Payload
          test -s "${IPA_NAME}"
          echo "Created ${IPA_NAME}"

      - name: Verify version inside IPA
        run: |
          unzip -l "${IPA_NAME}"
          unzip -p "${IPA_NAME}" Payload/LUNE.app/Info.plist > /tmp/LUNE-Info.plist
          plutil -lint /tmp/LUNE-Info.plist

          ACTUAL_VERSION=$(plutil -extract CFBundleShortVersionString raw -o - /tmp/LUNE-Info.plist)
          ACTUAL_BUILD=$(plutil -extract CFBundleVersion raw -o - /tmp/LUNE-Info.plist)
          ACTUAL_ID=$(plutil -extract CFBundleIdentifier raw -o - /tmp/LUNE-Info.plist)

          echo "Inside IPA: version=${ACTUAL_VERSION} build=${ACTUAL_BUILD} id=${ACTUAL_ID}"
          echo "Expected:   version=${MARKETING_VERSION} build=${BUILD_NUMBER} id=com.lune.cycletracker"

          if [ "$ACTUAL_VERSION" != "$MARKETING_VERSION" ]; then
            echo "ERROR: CFBundleShortVersionString mismatch"
            exit 1
          fi
          if [ "$ACTUAL_BUILD" != "$BUILD_NUMBER" ]; then
            echo "ERROR: CFBundleVersion mismatch"
            exit 1
          fi
          if [ "$ACTUAL_ID" != "com.lune.cycletracker" ]; then
            echo "ERROR: CFBundleIdentifier mismatch"
            exit 1
          fi
          echo "IPA_OK: version, build and bundle identifier verified"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.IPA_NAME }}
          retention-days: 30
          if-no-files-found: error

  unit-tests:
    name: Unit and integration tests (simulator)
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve version and build number
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          BUILD_NUMBER=${{ github.run_number }}
          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"

      - name: Available simulators
        run: xcrun simctl list devices available | head -40

      - name: Run tests
        run: |
          SIMULATOR=$(xcrun simctl list devices available | grep -m1 'iPhone 16 (' | sed -E 's/^[[:space:]]*([^()]*) \([^()]*\).*/\1/' | xargs)
          if [ -z "$SIMULATOR" ]; then
            SIMULATOR=$(xcrun simctl list devices available | grep -m1 'iPhone' | sed -E 's/^[[:space:]]*([^()]*) \([^()]*\).*/\1/' | xargs)
          fi
          echo "Using simulator: $SIMULATOR"
          xcodebuild test \
            -project LUNE.xcodeproj \
            -scheme LUNE \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "platform=iOS Simulator,name=$SIMULATOR" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=YES \
            -quiet
